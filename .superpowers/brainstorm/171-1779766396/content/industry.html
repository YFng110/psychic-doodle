<h2>公司所属行业/业务类型？</h2>
<p class="subtitle">不同行业对应的视觉风格和信息架构差异很大</p>

<div class="options">
  <div class="option" data-choice="tech" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>科技 / SaaS / 互联网</h3>
      <p>现代、简洁，强调产品能力和技术实力。深色或渐变背景常见。</p>
    </div>
  </div>
  <div class="option" data-choice="manufacturing" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>制造业 / 工业 / 实体产品</h3>
      <p>稳重、可信赖，强调生产能力和品质管控。蓝/灰色调为主。</p>
    </div>
  </div>
  <div class="option" data-choice="consulting" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>咨询 / 金融 / 专业服务</h3>
      <p>专业、权威，强调案例和团队实力。偏传统商务风格。</p>
    </div>
  </div>
  <div class="option" data-choice="other" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>其他行业</h3>
      <p>不在以上分类中，我直接告诉你。</p>
    </div>
  </div>
</div>
