<h2>品牌 naming & 资产</h2>
<p class="subtitle">决定是用真实品牌还是占位内容来搭建网站</p>

<div class="options">
  <div class="option" data-choice="real" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>有真实品牌</h3>
      <p>已有公司名称、Logo、品牌色等，直接在网站中使用真实信息。</p>
    </div>
  </div>
  <div class="option" data-choice="placeholder" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>先用占位内容</h3>
      <p>用虚拟的公司名（如"云际科技"、"NexaTech"等）搭建框架，后续替换为真实品牌。</p>
    </div>
  </div>
  <div class="option" data-choice="decide-later" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>你来推荐</h3>
      <p>先用一个看起来不错的占位品牌，我之后再告诉你真实的。</p>
    </div>
  </div>
</div>
