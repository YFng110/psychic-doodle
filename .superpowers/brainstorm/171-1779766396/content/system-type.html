<h2>这个内部管理系统主要管什么？</h2>
<p class="subtitle">管理系统的核心业务领域决定了功能模块和页面结构</p>

<div class="options">
  <div class="option" data-choice="erp" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>ERP / 进销存</h3>
      <p>采购、库存、销售、财务一体化管理。适合实体商品流通企业。</p>
    </div>
  </div>
  <div class="option" data-choice="crm" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>CRM / 客户管理</h3>
      <p>客户信息、跟进记录、销售漏斗、合同管理。适合销售驱动型企业。</p>
    </div>
  </div>
  <div class="option" data-choice="hrm" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>HRM / 人事管理</h3>
      <p>员工档案、考勤、薪酬、招聘、绩效。适合中大型团队。</p>
    </div>
  </div>
  <div class="option" data-choice="project" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>项目/任务管理</h3>
      <p>项目进度、任务分配、工时统计、团队协作。适合项目制团队。</p>
    </div>
  </div>
  <div class="option" data-choice="custom" onclick="toggleSelect(this)">
    <div class="letter">E</div>
    <div class="content">
      <h3>其他 / 自定义</h3>
      <p>不在以上分类中，我直接描述需求。</p>
    </div>
  </div>
</div>
