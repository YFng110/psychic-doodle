<h2>这个官网是给什么做的？</h2>
<p class="subtitle">了解网站的目的和定位，帮助确定整体风格和内容</p>

<div class="options">
  <div class="option" data-choice="company" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>公司/企业官网</h3>
      <p>展示公司信息、业务范围、团队、联系方式的正式企业网站。风格偏专业稳重。</p>
    </div>
  </div>
  <div class="option" data-choice="product" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>产品/SaaS 主页</h3>
      <p>展示某个产品或服务的 Landing Page，强调功能、定价、CTA 转化。风格偏现代营销向。</p>
    </div>
  </div>
  <div class="option" data-choice="personal" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>个人品牌站</h3>
      <p>个人作品集、博客或简历型网站。风格偏个性化表达。</p>
    </div>
  </div>
  <div class="option" data-choice="opensource" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>开源项目主页</h3>
      <p>GitHub 开源项目的文档展示页，强调文档、快速上手、社区。风格偏简洁技术向。</p>
    </div>
  </div>
</div>
