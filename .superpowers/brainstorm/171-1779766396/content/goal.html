<h2>官网的首要目标是什么？</h2>
<p class="subtitle">这决定了页面信息架构和 CTA 的设计重心</p>

<div class="options">
  <div class="option" data-choice="brand" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>品牌展示 + 信任建立</h3>
      <p>让访客了解公司是谁、做什么、为什么值得信赖。常见于 toB 公司。</p>
    </div>
  </div>
  <div class="option" data-choice="leads" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>获客 / 留资转化</h3>
      <p>驱动访客完成 demo 预约、试用注册或咨询留言。营销漏斗导向。</p>
    </div>
  </div>
  <div class="option" data-choice="recruit" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>招聘 + 雇主品牌</h3>
      <p>吸引人才，展示公司文化、团队和福利。技术团队常用。</p>
    </div>
  </div>
  <div class="option" data-choice="all" onclick="toggleSelect(this)">
    <div class="letter">D</div>
    <div class="content">
      <h3>综合型</h3>
      <p>以上都有，需要一个完整的企业门户，覆盖品牌、获客、招聘等多重目标。</p>
    </div>
  </div>
</div>
